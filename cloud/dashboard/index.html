<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Apiary - Fleet Dashboard</title>
<link rel="icon" href="icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg: #fbf8f2;
    --fg: #120805;
    --accent: #f2800f;
    --accent-2: #b05908;
    --muted: #6e6655;
    --card: #ffffff;
    --border: rgba(18, 8, 5, 0.08);
    --on-accent: #ffffff;
    --bar: #000000;
    --on-bar: #f3ece0;
    --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Inter", -apple-system, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-body);
    background: var(--bg); color: var(--fg); min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: none;
    background: var(--bar);
  }
  header h1 { margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--on-bar); font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; }
  header .config { display: flex; gap: 8px; align-items: center; }
  input, button, select {
    background: #fff; color: var(--fg); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
  }
  button { cursor: pointer; background: var(--accent); color: var(--on-accent); border: none; font-weight: 700; }
  button:hover { background: var(--accent-2); color: #fff; }
  button.ghost { background: rgba(243,236,224,0.12); color: var(--on-bar); border: 1px solid rgba(243,236,224,0.25); font-weight: 600; }
  button.ghost:hover { background: rgba(243,236,224,0.22); color: #fff; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--on-accent);
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .who label { color: var(--muted); font-size: 12px; }
  .who select { min-width: 200px; font-weight: 600; }
  .settings {
    display: none; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 12px 24px; border-bottom: 1px solid var(--border); background: #fff;
  }
  .settings.open { display: flex; }
  .settings .hint { color: var(--muted); font-size: 12px; flex-basis: 100%; }
  main { padding: 24px; display: grid; gap: 24px; max-width: 1400px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: 0 1px 3px rgba(18,8,5,0.06);
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
  .stat .value { font-family: var(--font-display); color: var(--accent); font-size: 32px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    box-shadow: 0 1px 3px rgba(18,8,5,0.06);
  }
  .card h2 { margin: 0 0 16px 0; font-family: var(--font-display); font-size: 14px; color: var(--fg); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
  td.mono { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .error { background: #fde8e8; color: #8a1f23; padding: 12px 16px; border-radius: 6px; border: 1px solid #f0c0c0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  canvas { max-height: 280px; }
  /* Loading skeleton shimmer */
  @keyframes shimmer { 0%{opacity:.4} 50%{opacity:.75} 100%{opacity:.4} }
  .skeleton { background: linear-gradient(100deg, #efe7d8 30%, #f7f1e6 50%, #efe7d8 70%); animation: shimmer 1.4s ease-in-out infinite; border-radius: 12px; }
  .skeleton-stat { height: 84px; }
  .skeleton-card { height: 280px; }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>OPEN APIARY &middot; FLEET</h1>
  <div class="who" id="who">
    <span class="badge" id="badge" style="display:none"></span>
    <label id="personaLabel" for="persona" style="display:none">Viewing</label>
    <select id="persona" style="display:none"></select>
    <button class="ghost" id="settingsBtn" title="Connection settings">&#9881;</button>
  </div>
</header>
<div class="settings" id="settings">
  <input id="apiUrl" placeholder="API URL" size="44" />
  <input id="email" type="email" placeholder="Email" size="26" />
  <input id="password" type="password" placeholder="Password" size="22" />
  <button id="loadBtn">Sign in</button>
  <button class="ghost" id="forgetBtn">Sign out</button>
  <div class="hint">Sign in with your Open Apiary account — the same email &amp; password you use in the app. Your admin access is tied to your account.</div>
</div>
<main>
  <div id="error"></div>
  <section class="stats" id="stats"></section>
  <section class="grid-2">
    <div class="card">
      <h2>Fleet weight - last 7 days</h2>
      <canvas id="weightChart"></canvas>
    </div>
    <div class="card">
      <h2>Hives by region</h2>
      <canvas id="regionChart"></canvas>
    </div>
  </section>
  <section class="card" id="usersCard" style="display:none">
    <h2>Users</h2>
    <div id="usersTable"></div>
  </section>
  <section class="card">
    <h2>Hives (anonymised)</h2>
    <div id="hivesTable"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LS_URL = 'oa.fleet.apiUrl';
const LS_KEY = 'oa.fleet.apiKey';
const LS_PERSONA = 'oa.fleet.persona';
const LS_EMAIL = 'oa.fleet.lastEmail';

$('apiUrl').value = localStorage.getItem(LS_URL) || 'https://api.openapiary.co.uk';
$('email').value = localStorage.getItem(LS_EMAIL) || '';
let apiKey = localStorage.getItem(LS_KEY) || '';

let weightChart, regionChart;
let currentPersona = localStorage.getItem(LS_PERSONA) || '';   // '' = full fleet
let usersById = {};

async function api(path, opts = {}) {
  const base = $('apiUrl').value.replace(/\/$/, '');
  const r = await fetch(base + path, {
    method: opts.method || 'GET',
    headers: { 'X-API-Key': apiKey, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) throw new Error(`${path}: ${r.status} ${await r.text()}`);
  return r.json();
}

async function login(email, password) {
  const base = $('apiUrl').value.replace(/\/$/, '');
  const r = await fetch(base + '/v1/account/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, device: 'admin-console' }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `login failed (${r.status})`);
  return j.api_key;
}

function personaQuery() {
  return currentPersona ? `?user=${encodeURIComponent(currentPersona)}` : '';
}

function setSettingsOpen(open) {
  $('settings').classList.toggle('open', open);
}

function renderIdentity(whoami) {
  const badge = $('badge');
  badge.style.display = 'inline-flex';
  badge.textContent = whoami.is_admin ? '\uD83D\uDC51 Admin' : (whoami.label || 'User');
  if (whoami.is_admin) {
    $('personaLabel').style.display = '';
    $('persona').style.display = '';
  }
}

function renderPersonaOptions() {
  const sel = $('persona');
  const opts = ['<option value="">All users — full fleet</option>'];
  for (const u of Object.values(usersById)) {
    const name = u.email || `user ${u.id.slice(0, 8)}`;
    const admin = u.is_admin ? ' ★' : '';
    opts.push(`<option value="${u.id}">${name}${admin} (${u.hive_count} hive${u.hive_count === 1 ? '' : 's'})</option>`);
  }
  sel.innerHTML = opts.join('');
  sel.value = currentPersona;
}

function renderStats(s) {
  const cells = currentPersona
    ? [
        ['Hives',           s.hives],
        ['Active 24h',      s.hives_active_24h],
        ['Readings (24h)',  s.readings_24h],
        ['Readings (total)', s.readings_total],
      ]
    : [
        ['Users',           s.users],
        ['Hives',           s.hives],
        ['Active 24h',      s.hives_active_24h],
        ['Readings (24h)',  s.readings_24h],
        ['Readings (total)', s.readings_total],
      ];
  $('stats').innerHTML = cells.map(([label, value]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value">${(value ?? 0).toLocaleString()}</div></div>`
  ).join('');
}

function renderHives(hives) {
  if (!hives.length) {
    $('hivesTable').innerHTML = '<div class="empty">No hives yet.</div>';
    return;
  }
  const rows = hives.map(h => `
    <tr>
      <td class="mono"><a href="device.html?hive=${encodeURIComponent(h.id)}" style="color:var(--accent-2);font-weight:600">${h.id}</a></td>
      <td class="mono">${h.user_prefix}...</td>
      <td>${h.region || '-'}</td>
      <td class="mono">${h.lat != null ? h.lat.toFixed(3) : '-'}, ${h.lon != null ? h.lon.toFixed(3) : '-'}</td>
      <td>${new Date(h.created_at).toLocaleDateString()}</td>
      <td>${h.public ? 'yes' : 'no'}</td>
    </tr>`).join('');
  $('hivesTable').innerHTML = `
    <table>
      <thead><tr><th>Hive ID</th><th>User</th><th>Region</th><th>Lat, Lon</th><th>Created</th><th>Public</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Region pie
  const byRegion = {};
  for (const h of hives) {
    const r = h.region || '(unset)';
    byRegion[r] = (byRegion[r] || 0) + 1;
  }
  const labels = Object.keys(byRegion);
  const data = Object.values(byRegion);
  if (regionChart) regionChart.destroy();
  regionChart = new Chart($('regionChart'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: ['#f2800f', '#b05908', '#834206', '#d2581f', '#f5a04d', '#fbddbb'],
        borderColor: '#fffdf7',
        borderWidth: 2,
      }],
    },
    options: { plugins: { legend: { labels: { color: '#1a1410' } } } },
  });
}

function renderWeightChart(readings) {
  // Aggregate to hourly average across the fleet so it's a usable signal at scale.
  const buckets = new Map();
  for (const r of readings) {
    if (r.weight_kg == null) continue;
    const hour = Math.floor(r.ts / 3_600_000) * 3_600_000;
    const b = buckets.get(hour) || { sum: 0, n: 0 };
    b.sum += r.weight_kg; b.n += 1;
    buckets.set(hour, b);
  }
  const points = [...buckets.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([ts, b]) => ({ x: ts, y: b.sum / b.n }));

  if (weightChart) weightChart.destroy();
  weightChart = new Chart($('weightChart'), {
    type: 'line',
    data: {
      datasets: [{
        label: 'Fleet mean weight (kg)',
        data: points,
        borderColor: '#f2800f',
        backgroundColor: 'rgba(242, 128, 15, 0.16)',
        fill: true,
        tension: 0.25,
        pointRadius: 0,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', ticks: { color: '#6e6047', maxTicksLimit: 8 }, grid: { color: 'rgba(26,20,16,0.08)' } },
        y: { ticks: { color: '#6e6047' }, grid: { color: 'rgba(26,20,16,0.08)' } },
      },
      plugins: { legend: { labels: { color: '#1a1410' } } },
    },
  });
}

$('loadBtn').onclick = async () => {
  localStorage.setItem(LS_URL, $('apiUrl').value);
  $('error').innerHTML = '';
  try {
    const email = $('email').value.trim();
    apiKey = await login(email, $('password').value);
    localStorage.setItem(LS_KEY, apiKey);
    localStorage.setItem(LS_EMAIL, email);
    $('password').value = '';
    await connect();
  } catch (e) {
    $('error').innerHTML = `<div class="error">${e.message}</div>`;
  }
};

$('forgetBtn').onclick = () => {
  localStorage.removeItem(LS_KEY);
  localStorage.removeItem(LS_PERSONA);
  apiKey = '';
  location.reload();
};

$('settingsBtn').onclick = () => {
  setSettingsOpen(!$('settings').classList.contains('open'));
};

$('persona').onchange = async () => {
  currentPersona = $('persona').value;
  localStorage.setItem(LS_PERSONA, currentPersona);
  await loadData();
};

async function loadData() {
  $('error').innerHTML = '';
  showLoading();
  const q = personaQuery();
  const [stats, hives, readings] = await Promise.all([
    api('/v1/admin/fleet/stats' + q),
    api('/v1/admin/fleet/hives' + q),
    api('/v1/admin/fleet/readings' + q),
  ]);
  renderStats(stats);
  renderHives(hives.hives);
  renderWeightChart(readings.readings);
}

function showLoading() {
  $('stats').innerHTML = Array.from({ length: 4 })
    .map(() => '<div class="skeleton skeleton-stat"></div>').join('');
  $('hivesTable').innerHTML = '<div class="skeleton" style="height:120px"></div>';
}

async function connect() {
  $('error').innerHTML = '';
  if (!apiKey) {
    setSettingsOpen(true);
    return;
  }
  try {
    const whoami = await api('/v1/admin/whoami');
    renderIdentity(whoami);
    setSettingsOpen(false);
    if (whoami.is_admin) {
      const { users } = await api('/v1/admin/users');
      usersById = Object.fromEntries(users.map(u => [u.id, u]));
      if (currentPersona && !usersById[currentPersona]) {
        currentPersona = '';
        localStorage.removeItem(LS_PERSONA);
      }
      renderPersonaOptions();
      renderUsers(users);
    }
    await loadData();
  } catch (e) {
    setSettingsOpen(true);
    $('error').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

function renderUsers(users) {
  $('usersCard').style.display = '';
  const rows = users.map(u => {
    const name = u.email || `(guest ${u.id.slice(0, 8)})`;
    const admin = u.is_admin ? '<span class="badge" style="font-size:10px">ADMIN</span>' : '';
    return `<tr>
      <td>${name} ${admin}</td>
      <td class="mono">${u.hive_count} hive${u.hive_count === 1 ? '' : 's'}</td>
      <td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td style="text-align:right">
        ${u.email ? `<button class="ghost" data-reset="${u.id}" style="color:var(--accent-2);border-color:var(--border)">Reset password</button>` : ''}
      </td>
    </tr>`;
  }).join('');
  $('usersTable').innerHTML = `
    <table>
      <thead><tr><th>User</th><th>Hives</th><th>Joined</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  $('usersTable').querySelectorAll('[data-reset]').forEach(btn => {
    btn.onclick = () => resetPassword(btn.getAttribute('data-reset'));
  });
}

async function resetPassword(userId) {
  const u = usersById[userId];
  const custom = prompt(`Reset password for ${u?.email}.\n\nLeave blank to auto-generate a temporary password, or type a new one (8+ chars):`, '');
  if (custom === null) return;
  try {
    const r = await api(`/v1/admin/users/${userId}/reset-password`, {
      method: 'POST', body: custom.trim() ? { password: custom.trim() } : {},
    });
    if (r.temporary_password) {
      alert(`Temporary password for ${r.email}:\n\n${r.temporary_password}\n\nShare it securely. They'll be signed out of all devices and must sign in with this.`);
    } else {
      alert(`Password updated for ${r.email}. They'll be signed out of all devices.`);
    }
  } catch (e) {
    alert('Reset failed: ' + e.message);
  }
}

// Auto-connect silently if we already have a session key.
if (apiKey) {
  connect();
} else {
  setSettingsOpen(true);
}
</script>
</body>
</html>
