# OpenApiary Worker config — isolated from any other project in the same Cloudflare account.
#
# Naming convention: every resource is prefixed `oa-` so it sorts together in the
# dashboard and never collides with Smart Hive Scale or any other project.
#
# Account: shared with Smart Hive Scale (same Cloudflare account); isolation is
# enforced by resource naming + per-resource secrets, not by separate accounts.

name = "oa-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Pinned so deploys don't rely on the token having account-list permission
# (account IDs are not secret — they appear in dashboard URLs).
account_id = "8e7dac970ca4f95a26333c1b17fb290e"

# Don't publish a *.workers.dev preview URL by default — we'll bind a custom
# route or hostname instead. Set true temporarily during local debugging only.
workers_dev = false

# Smart placement picks a region close to D1 automatically (free, recommended).
[placement]
mode = "smart"

# Cheap built-in logs/metrics (free tier — 200k events/day).
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production is the ONLY environment for now. Everything ships live here until
# the project is stable enough to warrant separate dev/staging targets again.
# Deploy with:  npx wrangler deploy --env production
# ---------------------------------------------------------------------------
[env.production]
name = "oa-api-prod"
workers_dev = false

# Primary API hostname on the main domain (Cloudflare provisions DNS + cert).
[[env.production.routes]]
pattern = "api.openapiary.co.uk"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "oa-prod"
database_id   = "0b326164-7fcc-4328-860c-b5057a5a8f9c"

# Firmware distribution: the app downloads firmware via the Worker, which pulls
# the binary from this PRIVATE GitHub release repo using GITHUB_TOKEN.
[env.production.vars]
GITHUB_REPO = "greadingsuk/openapiary"
# Ed25519 public key (32-byte hex) firmware packages must be signed with.
FIRMWARE_PUBLIC_KEY = "2b08e7cae962958feb9ac3d0360774d676038edf8c8553640ce031f89c0a9888"

# Secrets (set with `npx wrangler secret put <NAME> --env production`):
#   API_KEY, API_KEY_SALT, ADMIN_KEY, GITHUB_TOKEN
