; OpenApiary firmware — Seeed XIAO nRF52840 (Standard)
; See docs/migration-plan.md §4 for the full design.

[env:xiao_nrf52840]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    adafruit/Adafruit LittleFS
    adafruit/InternalFileSytem
build_flags =
    -DCFG_DEBUG=0
    -DCFG_LOGGER=0          ; disable serial logger to cut idle current
