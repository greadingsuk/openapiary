; OpenApiary firmware — Seeed XIAO nRF52840 (Standard, NOT Sense)
; See docs/migration-plan.md §4 for the full design.
;
; The official `platform-nordicnrf52` does not include a board definition for
; the XIAO nRF52840. We use maxgerhardt's community fork which adds `xiaoble`
; (XIAO nRF52840) and integrates the Adafruit nRF52 Arduino core
; (Bluefruit + InternalFS / LittleFS).

[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
lib_deps =
    bogde/HX711@^0.7.5
build_flags =
    -DCFG_DEBUG=0
    -DCFG_LOGGER=0          ; disable serial logger to cut idle current
