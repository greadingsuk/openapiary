; OpenApiary firmware — Seeed XIAO nRF52840 (Standard, NOT Sense)
; See docs/migration-plan.md §4 for the full design.
;
; The official `platform-nordicnrf52` does not include a board definition for
; the XIAO nRF52840. We use maxgerhardt's community fork which adds `xiaoble`
; (XIAO nRF52840) and integrates the Adafruit nRF52 Arduino core
; (Bluefruit + InternalFS / LittleFS).

[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
lib_deps =
    bogde/HX711@^0.7.5
build_flags =
    -DCFG_DEBUG=0
    -DCFG_LOGGER=0          ; disable serial logger to cut idle current
build_src_filter =
    +<*>
    -<diag_main.cpp>        ; production build excludes diag entry point
    -<hello_main.cpp>

; Diagnostic build — verbose USB-CDC serial menu + continuous BLE advert.
; Flash with:    pio run -e xiaoble_diag -t upload
; Monitor with:  pio device monitor -e xiaoble_diag
; Restore production with:  pio run -e xiaoble -t upload
[env:xiaoble_diag]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
lib_deps =
    bogde/HX711@^0.7.5
build_flags =
    -DCFG_DEBUG=2
    -DCFG_LOGGER=1
    -DOA_DIAG_BUILD=1
build_src_filter =
    +<*>
    -<main.cpp>             ; diag build replaces production main with diag_main
    -<hello_main.cpp>

; Minimal liveness probe — prints "tick N" every 500ms.
[env:xiaoble_hello]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
build_src_filter =
    +<hello_main.cpp>
