name: app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Skip if app is still a stub
        id: stub
        run: |
          if [ ! -f package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "App not scaffolded yet; skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.stub.outputs.skip == 'false'
        run: npm ci
      - name: Build
        if: steps.stub.outputs.skip == 'false'
        run: npm run build
